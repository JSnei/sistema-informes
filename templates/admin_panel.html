<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Administrativo</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        .opciones-admin {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .opcion {
            text-decoration: none;
            color: #222;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: 0.2s;
            background: #fafafa;
        }

        .opcion:hover {
            background: #f1f1f1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
        }

        .opcion-icono {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .opcion h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .opcion p {
            font-size: 13px;
            color: #777;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            .opciones-admin {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <main class="contenedor">

        <div class="tarjeta">

            <!-- LOGO -->

            <div class="logo">
                <img
                    src="/static/img/logo.png"
                    alt="Logo de la empresa"
                >
            </div>


            <!-- TÍTULO -->

            <div class="bienvenida">

                <h1>Panel administrativo</h1>

                <p>
                    Selecciona la opción que deseas realizar.
                </p>

            </div>


            <!-- OPCIONES -->

            <div class="opciones-admin">

                <!-- AGREGAR -->

                <a
                    href="/admin/agregar"
                    class="opcion"
                >

                    <div class="opcion-icono">
                            +
                    </div>

                    <h2>Agregar técnico</h2>
                            
                    <p>
                        Registrar una nueva persona
                        autorizada en el sistema.
                    </p>

                </a>


                <!-- EDITAR -->

                <a
                    href="/admin/tecnicos"
                    class="opcion"
                >

                    <div class="opcion-icono">
                        ✎
                    </div>

                    <h2>Editar técnicos</h2>

                    <p>
                        Consultar, modificar, activar
                        o desactivar técnicos.
                    </p>

                </a>

            </div>

        </div>

        <div class="footer">
            Administración · Sistema de Informes
        </div>

    </main>

</body>

</html>
