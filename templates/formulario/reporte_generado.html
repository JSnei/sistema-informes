<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reporte generado</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<main class="contenedor">

    <div class="tarjeta">

        <div class="logo">
            <img src="/static/img/logo.png" alt="Logo de la empresa">
        </div>


        <div class="bienvenida">

            <h1>Reporte listo</h1>

            <p>
                Revisa la información antes de enviarla.
            </p>

        </div>


        <div class="grupo">

            <label>Informe generado</label>

            <textarea
                id="mensaje"
                rows="18"
                readonly
            >{{ mensaje }}</textarea>

        </div>


        <button
            type="button"
            class="boton"
            onclick="copiarMensaje()"
        >
            Copiar reporte
        </button>


        <button
            type="button"
            class="boton"
            onclick="abrirWhatsApp()"
        >
            Abrir WhatsApp
        </button>


        <a
            href="/"
            class="cancelar"
        >
            Crear otro reporte
        </a>

    </div>

</main>


<script>

function copiarMensaje() {

    const mensaje =
        document.getElementById("mensaje").value;

    navigator.clipboard.writeText(mensaje);

    alert("Reporte copiado.");
}


function abrirWhatsApp() {

    const mensaje =
        document.getElementById("mensaje").value;

    const texto =
        encodeURIComponent(mensaje);

    window.open(
        "https://wa.me/?text=" + texto,
        "_blank"
    );
}

</script>

</body>
</html>
