<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Informes | BS Electromecánica</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>


<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="logo">
                <img
                    src="/static/img/logo.png"
                    alt="BS Electromecánica"
                >
            </div>


            <div class="bienvenida">

                <h1>Sistema de Informes</h1>

                <p>
                    Selecciona el tipo de acceso
                </p>

            </div>


            <div class="opciones-inicio">

                <a
                    href="/tecnico"
                    class="opcion-acceso"
                >
                    <div class="opcion-icono">
                        👷
                    </div>

                    <div class="opcion-texto">
                        <strong>Técnico</strong>

                        <span>
                            Registrar un servicio
                        </span>
                    </div>
                </a>


                <a
                    href="/admin"
                    class="opcion-acceso"
                >
                    <div class="opcion-icono">
                        🔐
                    </div>

                    <div class="opcion-texto">
                        <strong>Administrador</strong>

                        <span>
                            Gestión del sistema
                        </span>
                    </div>
                </a>

            </div>

        </div>

    </div>

</body>

</html>
